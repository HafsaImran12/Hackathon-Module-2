<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Profile | RecipeShare</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/editProfile.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a href="profile.html" class="navbar-brand logo">
          <i class="fa-solid fa-utensils me-2"></i>
          Recipe<span>Share</span>
        </a>

        <a href="profile.html" class="back-btn">
          <i class="fa-solid fa-arrow-left me-1"></i>
          Back to Profile
        </a>
      </div>
    </nav>

    <!-- ================= MAIN ================= -->

    <main class="edit-page">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-md-9">
            <!-- PAGE HEADING -->

            <div class="page-heading">
              <h2>Edit Profile</h2>

              <p>Update your personal information</p>
            </div>

            <!-- PROFILE CARD -->

            <div class="profile-card">
              <!-- AVATAR -->

              <div class="avatar-section">
                <div class="avatar"></div>

                <h5></h5>

                <p>Update your profile information</p>
              </div>

              <!-- FORM -->

              <form id="updateProfileForm">
                <div class="row g-4">
                  <!-- FIRST NAME -->

                  <div class="col-md-6">
                    <label for="firstName" class="form-label">
                      First Name
                    </label>

                    <input
                      type="text"
                      id="firstName"
                      class="form-control"
                      placeholder="Enter first name"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="lastName" class="form-label"> Last Name </label>

                    <input
                      type="text"
                      id="lastName"
                      class="form-control"
                      placeholder="Enter last name"
                      required
                    />
                  </div>

                  <!-- EMAIL -->
                  <div class="col-12">
                    <label for="email" class="form-label">
                      Email Address
                    </label>

                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      readonly
                    />
                  </div>

                  <!-- BUTTONS -->

                  <div class="col-12">
                    <div class="form-buttons">
                      <a href="./profile.html" class="btn cancel-btn">
                        Cancel
                      </a>

                      <button type="submit" id="saveBtn" class="btn save-btn">
                        <i class="fa-solid fa-check me-1"></i>
                        Save Changes
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- supabase cdn -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- supabase -->
    <script src="../js/supabase.js"></script>

    <!-- bootstrap -->
    <script src="../js/bootstrap.js"></script>

    <!-- signup -->
    <script src="../js/editProfile.js"></script>
  </body>
</html>
