<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RecipeShare | Recipe Details</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../css/bootstrap.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/recipeDetails.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand fw-bold fs-4" href="./home.html">
          <i class="fa-solid fa-utensils me-2"></i>

          Recipe<span>Share</span>
        </a>

        <!-- Mobile Button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-controls="navbarMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="./home.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./browse.html"> Browse </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./myRecipe.html"> My Recipes </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./addRecipe.html"> Add Recipe </a>
            </li>
          </ul>

          <!-- Profile -->
          <div class="dropdown profile-dropdown">
            <button
              class="btn profile-btn d-flex align-items-center gap-2"
              type="button"
              data-bs-toggle="dropdown"
            >
              <span id="profileInitial"> </span>

              <span id="profileName"> </span>

              <i class="fa-solid fa-chevron-down"></i>
            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li>
                <a class="dropdown-item" href="./profile.html">
                  <i class="fa-solid fa-user me-2"></i>

                  Profile
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="./myRecipe.html">
                  <i class="fa-solid fa-utensils me-2"></i>

                  My Recipes
                </a>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <button class="dropdown-item text-danger" id="logoutBtn">
                  <i class="fa-solid fa-right-from-bracket me-2"></i>

                  Logout
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">
      <div class="container text-center">
        <h1>Recipe Details</h1>

        <p>Explore the ingredients and instructions.</p>
      </div>
    </section>

    <!-- ================= RECIPE DETAILS ================= -->

    <main class="recipe-section">
      <div class="container">
        <div id="recipeDetails">
          <!-- Loading -->
          <div class="loading-box text-center">
            <div class="spinner-border text-warning" role="status"></div>

            <p class="mt-3 text-muted">Loading recipe...</p>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">
      <div class="container text-center">
        <p class="mb-0">© 2026 RecipeShare. All Rights Reserved.</p>
      </div>
    </footer>

    <!-- ================= SCRIPTS ================= -->

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Bootstrap -->
    <script src="../js/bootstrap.js"></script>

    <!-- Supabase Config -->
    <script src="../js/supabase.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Recipe Details JS -->
    <script src="../js/recipeDetails.js"></script>

    <!-- logout -->
    <script src="../js/logout.js"></script>
  </body>
</html>
